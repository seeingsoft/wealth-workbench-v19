<style>
:root{
  --paper:#f3f6fb; --rail:#0d1d35; --rail2:#13284a; --cobalt:#265dcc; --cobalt-h:#18479f; --accent:#315efb;
  --ink:#14213d; --muted:#5d6b82; --line:#dce3ed; --panel:#ffffff; --green:#0b7556; --red:#b33745; --yellow:#80500b; --yellow-bg:#fff7e7;
  --purple:#6b3fa0;
  --shadow:0 1px 3px rgba(13,29,53,.08),0 6px 18px rgba(13,29,53,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:236px 1fr;height:100vh}
.rail{background:var(--rail);color:#cdd8ec;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .b1{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px}
.brand .b2{color:#7e93b8;font-size:11px;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav .grp{margin-bottom:6px}
.nav .gh{color:#6f86ad;font-size:10.5px;font-weight:600;letter-spacing:1px;padding:10px 12px 5px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#cdd8ec;text-decoration:none;font-size:13px;transition:.15s;cursor:pointer}
.nav a:hover{background:var(--rail2);color:#fff}
.nav a.active{background:var(--cobalt);color:#fff;font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:14px}
.rail-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6f86ad;line-height:1.6}
/* ===== Topbar ===== */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0}
.topbar .crumb{font-size:13px;color:var(--muted)}
.topbar .crumb b{color:var(--ink)}
.topbar .sp{flex:1}
.badge{font-size:11px;padding:4px 9px;border-radius:20px;background:#eaf3ff;color:var(--cobalt);border:1px solid #cfe0ff;font-weight:600}
.badge.warn{background:var(--yellow-bg);color:var(--yellow);border-color:#f0d9a8}
.btn{background:var(--cobalt);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:var(--cobalt-h)}
.btn.ghost{background:#eef3fb;color:var(--cobalt);border:1px solid #d3e0f7}
.btn.ghost:hover{background:#e2ecfb}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.green{background:var(--green)}
.btn.green:hover{background:#085a44}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#92303c}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cobalt),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
/* ===== Content ===== */
.content{flex:1;overflow-y:auto;padding:22px 26px 40px}
.view-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.view-h h1{font-size:20px;font-weight:700}
.view-h .sub{color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);background:#eef4fb;border:1px dashed #b9cdec;border-radius:8px;padding:8px 12px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.hint .i{color:var(--cobalt);font-weight:700;flex-shrink:0}
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:#eef3fb;color:var(--cobalt);margin-left:auto;white-space:nowrap}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .n{font-size:26px;font-weight:800;color:var(--ink);line-height:1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:11.5px;font-weight:600}
.up{color:var(--green)} .down{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f3f8}
.row:last-child{border-bottom:none}
.pill{font-size:11px;padding:2px 9px;border-radius:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.p-green{background:#e4f3ec;color:var(--green)} .p-red{background:#fbe9ec;color:var(--red)}
.p-yel{background:var(--yellow-bg);color:var(--yellow)} .p-gray{background:#eef1f5;color:var(--muted)}
.p-blue{background:#e8f0fd;color:var(--cobalt)} .p-purple{background:#f0eaf8;color:var(--purple)}
.bar{height:7px;border-radius:5px;background:#eef1f5;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px}
.grp-title{font-size:13px;font-weight:700;color:var(--ink);margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.grp-title .ln{flex:1;height:1px;background:var(--line)}
.tabs{display:flex;gap:6px;background:#eef3fb;padding:4px;border-radius:10px;width:fit-content;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:7px 16px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button.on{background:#fff;color:var(--cobalt);box-shadow:var(--shadow)}
.flt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.flt button{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:18px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer}
.flt button.on{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:13px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--cobalt)}
/* ===== 客户卡片（首页潜客列表） ===== */
.clist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);cursor:pointer;transition:.15s}
.cc:hover{border-color:var(--cobalt);box-shadow:var(--shadow)}
.cc .top{display:flex;align-items:center;gap:10px}
.cc .nm{font-weight:700;font-size:15px}
.cc .meta{font-size:12px;color:var(--muted);margin-top:6px}
.cc .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.cc .next{font-size:11.5px;color:var(--cobalt);font-weight:600;margin-top:8px;background:#eef4fb;border-radius:7px;padding:5px 9px}
/* ===== 画像要素 ===== */
.pe-cat{margin-bottom:16px}
.pe-cat .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pe-cat .ph .ci{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;flex-shrink:0}
.pe-cat .ph .ct{font-weight:700;font-size:13.5px}
.pe-cat .ph .cn{font-size:11.5px;color:var(--muted);margin-left:auto}
.pe{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:10px 12px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.pe .tx{flex:1;font-size:13px}
.pe .tx .q{color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.src-badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:8px;color:#fff}
.mini-bar{width:44px;height:5px;border-radius:3px;background:#eef1f5;overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar>i{display:block;height:100%}
/* ===== 漏斗 ===== */
.funnel{display:flex;gap:4px;margin-top:8px}
.fseg{flex:1;border-radius:8px;padding:10px 6px 8px;text-align:center;cursor:pointer;transition:.15s;min-width:0}
.fseg:hover{filter:brightness(1.08)}
.fseg .fnum{font-size:19px;font-weight:800;color:#fff}
.fseg .flbl{font-size:10.5px;color:#fff;opacity:.92;margin-top:2px}
.fstage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f3f8;flex-wrap:wrap}
.fstage-row:last-child{border-bottom:none}
.fdots{display:flex;gap:3px}
.fdots .fd{width:15px;height:15px;border-radius:50%;background:#e4eaf3;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.fdots .fd.on{background:var(--cobalt)}
.fdots .fd.now{border:2px solid var(--ink)}
/* ===== 事件 / 活动 ===== */
.ev-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.ev-card .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:700}
.ev-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f1f4f8}
.ev-item:last-child{border-bottom:none}
.ev-item .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.act-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);margin-bottom:12px}
.act-card .ah{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.matched{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* ===== 话术 / 合规 ===== */
.script-draft{background:#f4f7fc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;color:#33425e;white-space:pre-wrap;margin-top:10px}

function closePeModal(){document.getElementById("modalHost").innerHTML="";}
function renderPeModal(){

    <div class="mh"><div class="mt">新增画像要素</div>

  setTimeout(()=>{
    const c=byId(selClient);

    document.getElementById("peOcrOut").innerHTML=`

        </div>`).join("")}
      <button class="btn sm" id="peOcrBtn" style="margin-top:10px" onclick="peOcrImport()">批量入库（已选 ${peCands.filter(x=>x.on).length} 条）</button>`;
  },600);
}
function peOcrImport(){
  const n=peCands.filter(x=>x.on).length;
  peCands.filter(x=>x.on).forEach(x=>addProfileElem(x));
  peCands=[];
  closePeModal();
  toast(`✓ 已入库 ${n} 条画像要素（来源：聊天记录 · 本地 OCR）`);
}
function peTalkSim(){
  const c=byId(selClient);
  const txt=document.getElementById("talkInput").value||`下个月孩子要出国读书了，这笔钱得留出来，剩下的再看看稳健的。`;
  document.getElementById("peTalkOut").innerHTML=`<div style="font-size:12px;color:var(--muted);padding:8px 0">AI 结构化提取中…</div>`;
  setTimeout(()=>{
    peExtracted=[
      {cat:"人生事件",text:`「${c.name}」孩子将出国/远行，家庭流动性需求上升（从口述：${txt.slice(0,24)}…）`,src:"客户经理录入",time:today()},
      {cat:"投资偏好",text:`偏好「稳健」——明确保留流动性后仍倾向稳健产品`,src:"客户经理录入",time:today()}
    ];
    document.getElementById("peTalkOut").innerHTML=`
      <div style="font-size:12px;color:var(--green);font-weight:600;margin:8px 0 4px">✓ 提取 ${peExtracted.length} 条要素（需你确认后入库）</div>
      ${peExtracted.map((x,i)=>`
        <div class="cand"><input type="checkbox" checked onchange="peExtracted[${i}].on=this.checked">
          <div class="ct">${esc(x.text)}<div class="cm">${catPill(x.cat)} ${srcPill(x.src)} · ${x.time}</div></div>
        </div>`).join("")}
      <button class="btn sm" style="margin-top:10px" onclick="peTalkImport()">确认入库</button>`;
  },600);
}
function peTalkImport(){
  peExtracted.filter(x=>x.on!==false).forEach(x=>addProfileElem(x));
  peExtracted=[];
  closePeModal();
  toast("✓ 已入库口述转述要素（来源：客户经理录入）");
}
function peManualSave(){
  const cat=document.getElementById("peCat").value;
  const text=document.getElementById("peText").value.trim();
  const src=document.getElementById("peSrc").value;
  if(!text){toast("请填写要素内容");return;}
  addProfileElem({cat,text,src,time:today()});
  closePeModal();
  toast("✓ 已保存画像要素");
}
function addProfileElem(x){
  const c=byId(selClient);
  c.profile.push({cat:x.cat,text:x.text,src:x.src,time:x.time});
  if(view==="profile")render();
}

function apCard(s,approved,closed){

  else if(approved&&!closed)acts=`<div class="acts"><button class="btn green sm" onclick="forwardScript(${s.id})">📤 已人工转发微信</button></div>`;
  else if(s.status==="rejected")acts=`<div style="font-size:11.5px;color:var(--red);font-weight:600;margin-top:6px">✕ 已驳回 · 建议人工当面沟通</div>`;
  else acts=`<div style="font-size:11.5px;color:var(--green);font-weight:600;margin-top:6px">✓ 已闭环留痕</div>`;

  const meta=(s.ref?`<span class="refbadge">★ 参考历史最优沟通</span>`:"")+(s.dims&&s.dims.length?s.dims.map(d=>`<span class="pill p-purple">${d}</span>`).join(""):"");
  return `<div class="ap">

      <div style="flex:1"><div style="font-weight:600;font-size:12.5px">${c.name} · ${s.scene}</div><div style="font-size:11px;color:var(--muted)">${s.ts} · 画像驱动草稿</div></div>

    <div class="script-draft">${esc(s.draft)}</div>
    ${key}

    ${acts}
  </div>`;
}

  TEMPLATES.push({id:tplSeq,cat:catGuess,title:(t.type||t.ch)+"·"+t.summary.slice(0,10)+(t.summary.length>10?"…":""),note:t.summary,use:0});

function advance(id){
  const c=byId(id);
  if(c.funnel>=5)return;
  c.funnel++;
  const st=STATUS_OF(c.funnel);
  toast(`${c.name} 推进至「${STAGES[c.funnel]}」`+(c.funnel>=3?" → 已转化，移交公司系统":""));
  render();
}

  <div class="hint"><span class="i">📖</span><div>本页为《理财师工作台功能说明与操作手册 v1.0》的<b>纯文本 HTML 排版</b>，内容与原手册逐字一致，仅做排版呈现。原型其余功能（潜客列表 / 画像 / 话术 / 跟进 / 漏斗 / 经验库）与 tab 导航均保留可用。<b>本工具只做高潜客户跟进开发，已成交客户移交公司系统。</b></div></div>

    </div>

    <h2>一、产品是什么</h2>

    <h3>1.1 一句话定位</h3>
    <p><b>理财师工作台 = 高潜客户跟进开发引擎（非全功能 CRM）。</b></p>
    <p>它只做一件事：帮理财师跟进、开发潜在客户（高潜客户），直到完成「开户 / 购买（理财）产品 / 投资」。已成交客户回归公司系统管理（文洁口径，详见 1.3）。</p>

    <h3>1.2 给谁用</h3>

      <li>运营经验（客户画像、沟通路径、话术、知识沉淀）属<b>使用者私有资产</b>，不跨用户共享。</li>
    </ul>

    <h3>1.3 解决什么痛点（为什么做这个工具）</h3>
    <table>
      <tr><th>痛点</th><th>现状</th><th>本工具的解法</th></tr>
      <tr><td><b>人工记忆靠不住</b></td><td>传统客户管理完全依赖人工记忆：信息流失、跟进不及时、激活方法匹配不当，大量潜力客户跟进中断后「石沉大海」</td><td>事件引擎自动触发（生日 / 人生事件 / 产品到期 / 公司活动），不靠记忆</td></tr>

      <tr><td><b>已成交客户难管</b></td><td>已成交客户涉及私募等产品数据，合规限制 + 信息不对称，个人工具取不到真实数据</td><td>收敛定位：已成交客户交回公司系统；本工具只做「过程管理」、不做「数据聚合」</td></tr>

    <div class="sec">文洁原话：「workbuddy 的工作台只适合管理潜在客户。如果是已经成交的客户，公司的工作台跟公司产品系统对接了，管理起来更加方便。现在很多产品都是私募基金，信息是无法从公开渠道获取的，所以 workbuddy 的工作台取不到真实的数据。所以 CRM 这一块，现在有合规限制、有信息不对称的问题，所以不好搞。」<br>→ 据此，本工具<b>只做潜在客户跟进开发</b>，不做全功能 CRM。</div>

    <h3>1.4 AI 只做后端运营的人工边界（最重要的使用前提）</h3>
    <ul>
      <li><b>AI 能做的（后端基础运营）</b>：整理画像、识别兴趣点、触发提醒、起草话术、记录跟进、沉淀经验。</li>
      <li><b>AI 不能做的（必须人工）</b>：
        <ul>
          <li>线下饭局获客、当面交换微信等<b>强社交信任积累</b>；</li>
          <li>高潜客户<b>接近成交关键阶段</b>的最终对接（避免客户感知 AI 服务产生不信任）；</li>
          <li><b>绝不在客户侧暴露 AI</b>、<b>绝不由 AI 自动读写 / 群发个人微信</b>。</li>
        </ul>
      </li>
    </ul>
    <p>所有面向客户的内容，必经「生成 → 合规检查 → 人批准 → 人工转发」四步（见 2.2 与第四章 话术模块）。</p>

    <h3>1.5 核心闭环</h3>
    <pre>画像（个微零散信息挖掘） → 事件/场景触发 → 个性化话术 → 人工跟进 → 转化闭环（开户/购买/投资）</pre>

    <h2>二、核心概念（深度解释）</h2>
    <div class="note">本节用「通俗类比」帮助第一次使用者建立心智模型。所有概念均来自规划 §2、§11 与 v1.7 原型。</div>

    <h3>2.1 「一个客户一个长期 Agent」（画像底座）</h3>
    <p><b>是什么</b>：把每个客户的画像，从「一张静态字段表」升级为「一个客户专属长期 Agent 的状态」。这个 Agent 有三个状态：</p>
    <table>
      <tr><th>状态</th><th>含义</th><th>在原型中的位置</th></tr>
      <tr><td><b>🧠 记忆库 Memory</b></td><td>每一条画像要素 = Agent 的一段记忆，必须带「来源可追溯」（源自哪条聊天记录 / 口述 / 截图）</td><td>客户画像页「客户长期 Agent 状态面板 · 记忆库」</td></tr>
      <tr><td><b>🎯 长期目标 Goals</b></td><td>用「开户 / 购买 / 投资」承载文洁的转化闭环目标，使画像不只是档案，而是「有方向的经营对象」</td><td>同面板「长期目标」三档进度（由漏斗阶段驱动）</td></tr>
      <tr><td><b>🔒 隔离边界 Isolation</b></td><td>每个客户 Agent 以个人专属云空间隔离，对应视频「每个 Agent 自带虚拟机」的隔离思想；原文留存、云端调用先脱敏，而非真开虚拟机</td><td>同面板「隔离边界 · 个人专属云空间」标注</td></tr>
    </table>
    <p><b>通俗类比</b>：客户在工具里有一个「<b>永远不遗忘的贴身助手</b>」——你跟他说过的每句话（投资偏好、孩子出国、养的狗叫 Lucky），他都记下来、标好来源和时间，并且只为你一个人服务、不对外泄露。</p>
    <p><b>验收口径（规划 §11.1）</b>：每位试点客户画像字段 <b>100% 带来源可追溯</b>；每位客户显式维护 <b>≥1 条长期目标</b>；画像数据<b>完整落在本地 / 私有实例</b>，无数据出个人设备。</p>

    <h3>2.2 人在回路 / need help（四步硬性范式）</h3>
    <p><b>是什么</b>：任何面向客户的内容，必须走四步，且任一步可「need help 转人工」：</p>
    <pre>① 生成草稿  →  ② 合规检查  →  ③ 人批准  →  ④ 人工转发</pre>
    <ul>
      <li>第①、②步可由 AI 完成（生成草稿 + 轻量合规检查）；</li>
      <li>第③步「人批准」是<b>硬闸门</b>：未过人批准，不得进入转发；</li>
      <li>第④步「人工转发」必须由你本人复制话术、粘贴到自己个人微信发送；</li>
      <li>当 AI 无法判断或触及信任 / 成交关键节点，触发 <b>need help</b> 转你（文洁）接管。</li>
    </ul>
    <p><b>通俗类比</b>：AI 是「秘书」，把信写好了、合规也自查过，但<b>信封必须你亲手拆、亲手寄</b>；秘书无权替你发任何一句话给客户。</p>
    <p><b>为什么是硬约束</b>：合规红线（见第五章），非可选优化。客户侧任何触点均由你本人操作，AI 不触达客户。</p>

    <h3>2.3 运营经验自学习自迭代（「复制最优秀的人」）</h3>
    <p><b>是什么</b>：把<b>你（文洁）自己</b>沉淀的沟通路径 / 话术，复制成可复用的「专家经验」——不是泛化模板，而是对标你历史最优沟通。</p>
    <ul>
      <li><b>「最优秀的人」= 使用者本人</b>（个人私有资产视角），而非跨组织复制；</li>
      <li><b>沉淀物</b>：成功跟进的沟通路径、话术、节奏模板、兴趣识别模式，经人审后进入「我的经验库」可复用；</li>
      <li>生成话术时自动<b>「参考历史最优沟通」</b>，而非纯泛化模板；</li>
      <li><b>单次成功跟进须经人审方可沉淀为模板</b>，避免错误经验固化。</li>
    </ul>
    <p><b>通俗类比</b>：工具像一面「镜子 + 笔记本」——你每次聊得好的打法，它默默记下来；下次遇到同类客户，它提醒你「上次你这么聊效果最好」。</p>
    <p><b>验收口径（规划 §11.2）</b>：沉淀若干条<b>经人审的专家经验模板</b>可复用；话术生成能引用历史最优话术作参照；信任 / 成交关键节点 <b>100% 保留人工</b>；专家经验文件属本地 / 私有、无外泄。</p>

    <h3>2.4 关系型经营（四维度）</h3>

        <h2>五、数据与合规说明</h2>
    <div class="note">本节对应规划 §3、§4、§5 及 §0.6。统一以「自动收件三通道 + 存量补充」说明数据来源；云端大模型 API 仅处理脱敏后的必要内容，完整合规边界以规划为准。</div>

    <h3>5.1 数据合规底线</h3>
    <ul>
      <li><b>绝大多数来自个人微信（个微）聊天记录</b>：对客户投资偏好 / 风险偏好 / 私人信息等 360 度零散信息进行挖掘，建立精细化画像；</li>
      <li><b>云端路线，个人专属云空间承载</b>：原始聊天记录 / 截图 / 录音仍只存个人设备或个人专属云盘，不进入第三方；运营经验属使用者私有资产。</li>
      <li><b>客户本人授权条款</b>：分析客户记录须有客户本人授权（知情同意）；不分析他人记录（违反《个人信息保护法》与用户协议）；</li>
      <li><b>个微不 AI 旁听</b>：个微场景不拉群让 AI 旁听；AI 只在后端处理经授权、脱敏后的必要内容，绝不自动读写 / 群发个微。</li>
      <li><b>脱敏出域</b>：画像抽取 / 结构化 / 话术生成统一调用云端大模型 API；去姓名、手机号、身份信息后再发送，服务商须为境内合规且承诺不将用户数据用于模型训练。</li>
    </ul>

    <h3>5.2 微信聊天记录导入方案（单一线索）</h3>
    <div class="note">导入方案只有一条主线：<b>自动收件三通道（主架构）+ 存量记录补充（降级）</b>。三通道与归属流程见「📥 收件与归属」页；数据处理遵守最小必要、知情同意、可删除与脱敏出域边界。</div>

    <h4>5.2.1 ① 自动收件通道（主架构，规划 §3.5）</h4>
    <p><b>决策</b>：微信客服（路 A）、成员账号 + 会话存档（路 B）、公众号订阅号（路 C）三条收件通道能力<b>并行具备</b>，按客户 / 用户需求适配，而非单选——这是导入方案的主架构。</p>
    <p><b>架构形态</b>：平台方（部署方）统一建设三个收件入口 → 统一平台后端（按用户 / 客户身份路由）→ 各自私有工作台 / vault；用户侧统一为「添加入口 → 绑定 → 转发」三步，零自建、零技术门槛。</p>
    <table>
      <tr><th>路</th><th>通道</th><th>主体</th><th>适用</th></tr>
      <tr><td>路 A</td><td>微信客服</td><td>平台方认证企微</td><td>托管 / 机构化客户、需要官方客服入口体验（微信内直接添加客服，多用户共享一个入口）</td></tr>
      <tr><td>路 B</td><td>成员账号 + 会话存档</td><td>平台方企业版企微</td><td>强合规客户（会话存档官方自动留痕）、需要「好友式关系 + 全量自动留存」的场景</td></tr>
      <tr><td>路 C</td><td>公众号订阅号</td><td>平台方注册公众号（门槛最低，个人 / 企业主体均可）</td><td>独立理财师 / 轻量用户、平台 MVP 验证期</td></tr>
    </table>
    <p><b>统一后端职责</b>：三通道消息归一（文本 / 图片 / 语音转文字 / 文件）→ 按用户路由 → 写入对应私有 vault / 工作台；通道差异对用户透明。可先以路 C（公众号）验证模式，再叠加路 A / 路 B；三条通道共享同一后端，无重复建设。</p>
    <p><b>用户三步操作</b>：① 添加收件助手入口（路 A / 路 B / 路 C 之一，三条通道并行具备）→ ② 绑定 → ③ 在个人微信中将聊天记录「合并转发 / 单条转发」到已绑定助手。转发后中置信候选 5 秒内弹窗确认（默认推荐 Top-1），或到「待归属队列」批量处理；高置信自动归属，无需干预。</p>
    <div class="sec">红线与约束不变：数据只经自建后端，不出第三方；潜在客户属用户私有资产；客户本人授权条款；个微不 AI 旁听、PyWxDump / Hook 禁用等既有红线不因新增通道而削弱。</div>
    <p><b>后续处理（客户归属与数据清洗，详见规划 §3.6 / §3.7）</b>：转发内容经统一后端自动进入「客户归属机制」与「数据清洗管道」。高置信 ≥ 0.90 自动归属，中置信 0.60–0.90 进入候选确认，低置信进入待归属队列；任意变更留审计、100% 可追溯。清洗依次完成消息归一 → 去噪 → 抽取 → 结构化 → 人审闸门 → 入库；调用云端大模型 API 前先脱敏。画像要素绑定 <code>{原文片段 snippet, 时间 ts, src_ref_id}</code>，原文进原始仓留证、不进检索、不进 vault。</p>
    <div class="sec">✅ <b>原型已更新</b>：左侧「📥 收件与归属」页展示路 A / 路 B / 路 C 三通道、确认弹窗与待归属队列的静态流程。</div>

    <h4>5.2.2 ② 存量记录补充方式（降级表述，人工供给）</h4>
    <p>适用于<b>历史存量聊天记录</b>，由客户经理人工供给，不依赖自动通道：</p>
    <ul>
      <li><b>口述转述 + AI 结构化（存量）</b>：客户经理在授权范围内录入沟通要点；必要内容脱敏后调用云端大模型 API 生成画像候选，最小必要、知情同意、人审后入库。</li>
      <li><b>自有设备截图 + OCR（存量）</b>：本人对话截图先做 OCR，再对脱敏文本进行云端结构化；原图留在个人设备或个人专属云空间，候选经人审后入库。</li>
    </ul>

    <h4>5.2.3 红线清单（机构生产禁用 / 必守）</h4>
    <table>
      <tr><th>红线</th><th>说明</th><th>依据</th></tr>
      <tr><td><b>PyWxDump 类解密工具禁用</b></td><td>本地库解密导出属灰色地带、违反用户协议；PyWxDump 已于 2025-10-20 收微信官方律师函并删除，机构生产不建议采用</td><td>规划 §3.3</td></tr>
      <tr><td><b>Hook 机器人 / 协议模拟禁用</b></td><td>WeChatFerry、wechaty 个微通道、pc-wechat-hook、itchat 等违反协议明令禁止条款，封号风险高</td><td>规划 §3.3</td></tr>
      <tr><td><b>无授权第三方解析禁用</b></td><td>未授权第三方「解析/代抓」服务属违规、数据出境风险高</td><td>规划 §3.3</td></tr>
      <tr><td><b>不分析他人记录</b></td><td>未经同意获取/分析客户、同事聊天记录，违反《个人信息保护法》与用户协议</td><td>规划 §3.3</td></tr>
      <tr><td><b>个微不 AI 旁听</b></td><td>个微场景高净值客户对 AI 介入敏感度高，直接拉群让 AI 旁听会引发反感</td><td>规划 §4</td></tr>
      <tr><td><b>原文留存与脱敏出域</b></td><td>原始数据留个人设备或个人专属云空间；仅脱敏必要内容调用境内合规云端大模型 API</td><td>规划 §0.6</td></tr>
      <tr><td><b>人在回路硬闸门</b></td><td>面向客户内容必经「生成→合规检查→人批准→人工转发」，AI 不自动读写/群发个微</td><td>规划 §4、§11.3</td></tr>
    </table>
    <p><b>采集原则</b>：最小必要 + 知情同意 + 可删除；输出画像脱敏（去手机号 / 身份信息）；敏感字段加密；定期备份并建台账。</p>
    <p><b>话术合规五提示（原型内置）</b>：不荐股 / 不荐具体证券；不承诺收益；适当性前置（话术风险等级 ≤ 客户风险偏好）；风险提示义务；私募不晒收益 / 测评不外泄。</p>

    <h4>5.2.4 备注（一句）</h4>
    <p>官方腾讯 <b>ClawBot</b> 可作为「新增会话」的可选官方通道（2026-03-22 发布，不读历史记录 / 通讯录、不上传文件、本地自持），此处不展开，详见规划 §3.2。</p>

    <h3>5.3 留证条款</h3>
    <p>官方「备份与恢复」（U 盘 / NAS / 云盘，2025-07-04 起）定期<b>加密备份关键会话</b>，建立「时间 / 范围 / 归档人」<b>台账</b>，满足监管留痕要求：保证原始记录完整可追溯、未删改（满足「未删改原始记录（PDF + 原始导出包）」检查口径）；加密凭证不可直接喂 AI。原始仓按本条款精神留存、加密、可删除（最小必要 + 可删除）。</p>


<h2>六、试点操作流程（10 人）</h2>
    <div class="note">对应规划 §2.4、§8（Phase 0–4）。从录入画像 → 触发跟进 → 话术生成 → 人工跟进 → 效果度量。</div>

    <h3>6.1 试点对象与口径</h3>
    <ul>
      <li><b>10 名存量高潜客户</b>；原型演示造 8 名（c1–c8），试点口径以 10 名为准；</li>
      <li>目标：验证客户管理效率与转化效果的实际提升；跑通后扩大覆盖。</li>
    </ul>

    <h3>6.2 完整操作路径（照着做）</h3>
    <p><b>Phase 0 · 试点准备</b></p>
    <ol>
      <li>选定 10 名存量高潜客户名单；</li>
      <li>为每位客户明确画像导入方式（存量补充：口述转述 / 截图 OCR；自动通道：成员账号 + 会话存档 路 B）；</li>
      <li>配置个人专属云空间与境内合规云端大模型 API；原文留存、调用前脱敏。</li>
    </ol>
    <p><b>Phase 1 · 画像底座</b></p>
    <ol start="4">
      <li>打开「👤 客户画像」，对每位客户点「＋ 新增画像要素」；</li>
      <li>用<b>三入口</b>录入：截屏 OCR（存量聊天）、口述转述（当面/电话要点）、手动录入（已知信息）；</li>
      <li>核对每条要素<b>带来源 + 时间</b>（记忆库可追溯）；</li>
      <li>在「客户长期 Agent 状态面板」确认每位客户 ≥1 条长期目标（开户/购买/投资）。</li>
    </ol>
    <p><b>Phase 2 · 跟进引擎</b></p>
    <ol start="8">
      <li>打开「⏰ 事件 / 场景触发」：看临期事件；</li>
      <li>点「模拟触发」演练；对公司活动点「匹配并生成话术」自动生成专属邀约；</li>
      <li>打开「💬 个性化话术」：选客户 + 场景 + 关系型目标维度 → 生成草稿；</li>
      <li>走四步链路：生成草稿 → 合规检查 → <b>你点「批准」</b> → <b>你人工转发个人微信</b>；卡住点「need help 转人工」。</li>
    </ol>
    <p><b>Phase 3 · 人工跟进（关键）</b></p>
    <ol start="12">
      <li>打开「📋 跟进记录」：每次沟通后「＋ 记录一次跟进」；</li>
      <li>接近成交客户：时间线标记「必须人工对接」，关键节点你本人面谈/电话，AI 不代发；</li>
      <li>成功跟进点「🧠 沉淀为模板」进入「我的经验库」。</li>
    </ol>
    <p><b>Phase 4 · 转化与度量</b></p>
    <ol start="15">
      <li>打开「🔻 转化漏斗」：点「推进一档」模拟流转；到「开户」即已转化 → 移交公司系统；</li>
      <li>度量指标：跟进及时率、话术批准率、接近成交人工对接率、转化数；关系经营指标（客户回应质量、信任信号）纳入评测，不单纯以成交为唯一 KPI。</li>
    </ol>

    <h3>6.3 注意事项</h3>
    <ul>
      <li><b>绝不在客户侧暴露 AI</b>：所有外发内容由你本人复制粘贴发送；</li>
      <li><b>接近成交必人工</b>：funnel≥2 客户的关键节点，AI 仅记录与提醒，不代发；</li>
      <li><b>来源可追溯</b>：每条画像要素可修正、可删除，发现错误立即改；</li>
      <li><b>合规优先</b>：走导入方案（自动收件通道 + 存量补充），禁用 PyWxDump / Hook / 无授权第三方解析；</li>
      <li><b>经验私有</b>：沉淀模板属你本人，不外泄、不跨用户共享。</li>
    </ul>

    <h2>七、常见问题 FAQ</h2>
    <p><b>Q1：客户信息怎么录入最省力？</b><br>用「客户画像 → ＋ 新增画像要素」的<b>三入口</b>：① 截屏 OCR——把个微聊天截图导入，本地 OCR 自动识别候选要素，勾选入库；② 口述转述——把客户当面/电话说的话口述出来，AI 结构化提取；③ 手动录入——已知信息直接填。最省力是<b>截屏 OCR + 口述转述</b>（存量），企微客户可用成员账号 + 会话存档通道（路 B）自动同步。</p>
    <p><b>Q2：AI 生成的话术能直接发吗？</b><br><b>不能</b>。话术是「建议草稿」，必经「生成 → 合规检查 → <b>人批准</b> → <b>人工转发</b>」四步。你点「批准」后，需自己复制话术、粘贴到个人微信发送。AI 绝不自动读写 / 群发个微。任一步可「need help 转人工」。</p>
    <p><b>Q3：私募数据取不到怎么办？</b><br>本工具<b>不做数据聚合</b>，私募产品信息无法从公开渠道获取（文洁口径）。工具只做「过程管理」：画像、触发、话术、跟进、转化闭环。已成交客户（含私募持仓）回归公司系统管理。</p>
    <p><b>Q4：手机能用吗？</b><br>原型为响应式 Web（窄屏自动转为顶部横向导航），手机浏览器可看；规划含 PWA（自用主力）+ 微信 H5 只读分享页。正式部署可在个人手机 / 个人电脑远程访问私有化实例（公司设备不留痕）。</p>
    <p><b>Q5：客户聊天记录怎么导入才合规？</b><br>走单一导入方案：① 自动收件通道（主架构，微信客服 / 成员账号+会话存档 / 公众号订阅号 三并行，见 §3.5）；② 存量补充（口述转述 + AI 结构化 / 自有设备截图 + 本地 OCR，历史记录人工供给）；官方 ClawBot 为新会话可选官方通道（详见规划 §3.2）。<b>禁用</b> PyWxDump 类解密、Hook 机器人、无授权第三方解析。<b>个微不 AI 旁听</b>（不拉群让 AI 听）。</p>
    <p><b>Q6：十个客户够吗？演示怎么只有 8 个？</b><br>试点口径为 <b>10 名存量高潜客户</b>；原型演示造 8 名（c1–c8）仅为展示。跑通后扩大覆盖。</p>
    <p><b>Q7：「一个客户一个长期 Agent」是什么？要开虚拟机吗？</b><br>是一种<b>画像底座隐喻</b>：把客户画像看作「客户专属长期 Agent 的状态」——记忆库（可追溯要素）/ 长期目标（开户购买投资）/ 隔离边界（个人专属云空间）。<b>不需要真开虚拟机</b>，通过专属空间权限隔离与脱敏出域达成。</p>
    <p><b>Q8：话术生成选了「关系型经营目标维度」有什么用？</b><br>勾选信任积累 / 情绪价值 / 专业服务 / 转化推进（可多选）后，生成话术会按所选维度给对应提示，体现「关系型经营」而非只盯转化（如「先建信任、不急于推产品」）。</p>
    <p><b>Q9：什么是「参考历史最优沟通」？</b><br>生成话术时自动标注「★ 参考历史最优沟通」，即引用你（文洁）历史最优沟通路径作参照（P0-2 复制最优秀的人=复制你自己），而非纯泛化模板。</p>
    <p><b>Q10：我的运营经验会泄露吗？</b><br>运营经验（画像、话术、沟通路径）属<b>使用者私有资产</b>；由个人专属云空间隔离，不跨用户共享。云端模型调用仅发送脱敏后的必要内容。</p>

      · Obsidian 不承载任何实时业务操作(审批/跟进状态),只承载知识资产。
    </div>

  {t:"欢迎使用 v1.7 高潜跟进版",d:"这是你的<b>高潜客户跟进开发引擎</b>：只做一件事——帮你跟进开发潜在客户。已成交客户交给公司系统。核心闭环：<b>画像 → 事件触发 → 话术 → 人工跟进 → 转化</b>。本版新增 P0×4：客户长期 Agent 状态面板、我的经验库、四步链路（need help 转人工）、关系型经营目标维度。本原型为<b>合成数据演示，开箱即用，无需后端</b>。"},
  {t:"三分钟看懂（重点看这页）",d:"① <b>客户画像</b>：把个微聊天里的零散信息挖成可追溯的画像要素（三个合规录入入口）；② <b>事件触发</b>：生日/人生事件/到期/活动自动提醒；③ <b>话术</b>：AI 起草 → 合规提示 → 你批准 → 人工转发。接近成交必须人工对接。"},
  {t:"从哪里开始",d:"建议：首页看今日提醒 → 打开一位客户补画像要素 → 到事件页模拟一次活动匹配 → 话术页批准一条草稿 → 记录一次跟进。点右上角「新手引导」可随时重看。"}
];
let wsIdx=0;
function openWelcome(){
  wsIdx=0;
  document.getElementById("modalHost").innerHTML=`<div class="mask" onclick="if(event.target===this)closeWelcome()"><div class="modal">
    <div class="mh"><div class="mt" id="wsT"></div><div class="ms" id="wsS"></div></div>
    <div class="mb"><div class="steps" id="wsSteps"></div><div class="wstep" id="wsBody"></div></div>
    <div class="mf"><button class="btn ghost" onclick="closeWelcome()">跳过</button><button class="btn" id="wsNext" onclick="wsNext()">下一步</button></div>
  </div></div>`;
  renderWelcome();
}
function renderWelcome(){
  document.getElementById("wsT").textContent=WSTEPS[wsIdx].t;
  document.getElementById("wsS").textContent=`第 ${wsIdx+1} / ${WSTEPS.length} 步`;
  document.getElementById("wsSteps").innerHTML=WSTEPS.map((_,i)=>`<div class="s ${i<=wsIdx?'on':''}"></div>`).join("");
  document.getElementById("wsBody").innerHTML=`<div class="wd">${WSTEPS[wsIdx].d}</div>`;
  document.getElementById("wsNext").textContent=wsIdx===WSTEPS.length-1?"开始体验":"下一步";
}
function wsNext(){if(wsIdx<WSTEPS.length-1){wsIdx++;renderWelcome();}else closeWelcome();}
function closeWelcome(){document.getElementById("modalHost").innerHTML="";}

/* ===================== 启动 ===================== */
renderNav();
go("home");
setTimeout(openWelcome,500);
